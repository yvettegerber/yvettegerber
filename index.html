	<script>

	<script>
		// DOM ready
		$(function () {

			// Create the dropdown base
			$("<select />").appendTo("nav");

			// Create default option "Menu"
			$("<option />", {
				"selected": "selected",
				"value": "",
				"text": "Menu"
			}).appendTo("nav select");

			// Populate dropdown with menu items
			$("nav a").each(function () {
				var el = $(this);
				$("<option />", {
					"value": el.attr("href"),
					"text": el.text()
				}).appendTo("nav select");
			});

			// Make dropdown work
			$("nav select").change(function () {
				window.location = $(this).find("option:selected").val();
			});

		});
	</script>
